<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-label="Religion History Timeline: Interactive star-chart timeline of 44 world religions: when and how each came out, key moments, sources, and which faiths grew out of which."><title>Religion History Timeline: Interactive star-chart timeline of 44 world religions: when and how each came out, key moments, sources, and which faiths grew out of which.</title><style>@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } } .tw0 { animation: twinkle 2.4s ease-in-out infinite; } .tw1 { animation: twinkle 3.1s ease-in-out 0.8s infinite; } .tw2 { animation: twinkle 1.9s ease-in-out 1.4s infinite; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tl0 { opacity: 1 !important; } }</style><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8ff"/></linearGradient></defs><rect x="0.5" y="0.5" width="399" height="159" rx="12" fill="url(#card)"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f1c35"/><stop offset="1" stop-color="#0b1026"/></linearGradient><clipPath id="top"><rect x="0.5" y="0.5" width="399" height="159" rx="12"/></clipPath></defs><g clip-path="url(#top)"><rect width="400" height="64" fill="url(#art)"/><polyline points="37.8,18.1 86.6,34.7 152.5,41.1 214.5,47.7 255.3,36.4 317.9,20.9 384.3,42.2" fill="none" stroke="#fa9ec1" stroke-opacity="0.55" stroke-width="1"/><circle class="tw0" cx="37.8" cy="18.1" r="3.2" fill="#f0f4ff"/><circle class="tw1" cx="86.6" cy="34.7" r="2.3" fill="#f0f4ff"/><circle class="tw2" cx="152.5" cy="41.1" r="2.8" fill="#f0f4ff"/><circle class="tw0" cx="214.5" cy="47.7" r="1.8" fill="#f0f4ff"/><circle class="tw1" cx="255.3" cy="36.4" r="1.9" fill="#f0f4ff"/><circle class="tw2" cx="317.9" cy="